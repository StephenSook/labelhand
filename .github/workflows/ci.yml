name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Branches supersede; every main commit keeps its own run so each merged SHA gets a verdict.
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv venv --python 3.12 && uv pip install -r pyproject.toml --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q
      - name: No em-dash in tracked text
        run: |
          if git ls-files -z -- '*.md' '*.py' '*.yml' ':(exclude)data/**' | xargs -0 grep -l $'\xe2\x80\x94' ; then
            echo "em-dash found"; exit 1
          fi

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      - name: Build WASM
        run: wasm-pack build core --target web --release -- --features wasm

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.99.0
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        working-directory: .
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Rebuild WASM for freshness check
        working-directory: .
        run: wasm-pack build core --target web --release -- --features wasm
      - name: Sync browser engine and data
        run: pnpm sync-engine
      # Data copies are platform independent, so they must match byte for byte. The WASM is not: rustc embeds host
      # source paths, so a Linux build never equals the committed Windows build. The committed WASM is instead held
      # to every frozen engine fixture by the unit tests above (tests/engine.test.ts).
      - name: Verify committed browser data is fresh
        working-directory: .
        run: git diff --exit-code -- web/public/data
